<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="50%" stop-color="#12141D"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#E11D48" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E2230" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Rack Chassis -->
  <rect width="1200" height="320" rx="14" fill="url(#bg)" stroke="#262936" stroke-width="3"/>
  <rect x="15" y="15" width="1170" height="290" rx="8" fill="url(#grid)" opacity="0.6"/>

  <!-- Rack Screws -->
  <circle cx="35" cy="35" r="6" fill="#2A2E3D"/><circle cx="35" cy="285" r="6" fill="#2A2E3D"/>
  <circle cx="1165" cy="35" r="6" fill="#2A2E3D"/><circle cx="1165" cy="285" r="6" fill="#2A2E3D"/>

  <!-- Left Spinning Studer Tape Reel -->
  <g transform="translate(145, 160)">
    <circle r="78" fill="#0D0E12" stroke="#2E3346" stroke-width="3"/>
    <circle r="58" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <path d="M-12,-68 L12,-68 L6,-22 L-6,-22 Z" fill="#3B4254"/>
      <path d="M-12,-68 L12,-68 L6,-22 L-6,-22 Z" fill="#3B4254" transform="rotate(120)"/>
      <path d="M-12,-68 L12,-68 L6,-22 L-6,-22 Z" fill="#3B4254" transform="rotate(240)"/>
    </g>
    <circle r="18" fill="#16181F" stroke="#06B6D4" stroke-width="2"/>
    <circle r="5" fill="#E11D48"/>
  </g>

  <!-- Center Oscilloscope Screen -->
  <rect x="260" y="32" width="680" height="256" rx="10" fill="#07080C" stroke="#262B3D" stroke-width="2"/>
  <line x1="260" y1="160" x2="940" y2="160" stroke="#1E2436" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Animated Cyan Sub-Bass Wave -->
  <path fill="none" stroke="#06B6D4" stroke-width="2.5" opacity="0.65" filter="url(#glow)">
    <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
      M 270 160 Q 355 90, 440 160 T 610 160 T 780 160 T 930 160;
      M 270 160 Q 355 230, 440 160 T 610 160 T 780 160 T 930 160;
      M 270 160 Q 355 90, 440 160 T 610 160 T 780 160 T 930 160" />
  </path>

  <!-- Animated Crimson Surgical Transient Wave -->
  <path fill="none" stroke="url(#crimson)" stroke-width="3.5" filter="url(#glow)">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
      M 270 160 C 330 60, 390 260, 450 160 C 510 160, 570 160, 630 160 C 690 50, 750 270, 810 160 L 930 160;
      M 270 160 C 330 250, 390 70, 450 160 C 510 160, 570 160, 630 160 C 690 265, 750 55, 810 160 L 930 160;
      M 270 160 C 330 60, 390 260, 450 160 C 510 160, 570 160, 630 160 C 690 50, 750 270, 810 160 L 930 160" />
  </path>

  <!-- Hard-Mute Region Overlay Box -->
  <rect x="465" y="42" width="150" height="236" fill="#E11D48" fill-opacity="0.08" stroke="#E11D48" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="540" y="64" fill="#E11D48" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">[HARD_MUTE : 0.0 dBFS]</text>

  <!-- Title & Telemetry Overlay -->
  <text x="600" y="135" fill="#FFFFFF" font-family="sans-serif" font-size="54" font-weight="900" letter-spacing="8" text-anchor="middle" filter="url(#glow)">K1-STUDIO</text>
  <text x="600" y="195" fill="#06B6D4" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="3" text-anchor="middle">32-BIT FLOAT SURGICAL STEM-MIXING &amp; MASTERING DAW</text>
  <text x="280" y="272" fill="#64748B" font-family="monospace" font-size="11">SR: 48.0 kHz | FLOAT32 | M/S SUB &lt;85Hz MONO</text>
  <text x="920" y="272" fill="#10B981" font-family="monospace" font-size="11" text-anchor="end">TARGET: -9.5 LUFS | -0.3 dBTP</text>

  <!-- Right Dual LED VU Meters -->
  <g transform="translate(985, 45)">
    <rect x="0" y="0" width="155" height="230" rx="8" fill="#0B0C12" stroke="#262B3D" stroke-width="2"/>
    <text x="77" y="24" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MASTER BUS</text>
    
    <!-- Left Channel Meter Bar -->
    <rect x="35" y="40" width="28" height="165" rx="3" fill="#141722"/>
    <rect x="35" y="40" width="28" height="165" rx="3" fill="#10B981">
      <animate attributeName="y" values="95;52;110;45;85;95" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="height" values="110;153;95;160;120;110" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <!-- Peak LED L -->
    <rect x="35" y="32" width="28" height="5" rx="1" fill="#E11D48">
      <animate attributeName="opacity" values="0.2;1;0.2;0.9;0.2" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <!-- Right Channel Meter Bar -->
    <rect x="92" y="40" width="28" height="165" rx="3" fill="#141722"/>
    <rect x="92" y="40" width="28" height="165" rx="3" fill="#06B6D4">
      <animate attributeName="y" values="100;48;115;42;90;100" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="height" values="105;157;90;163;115;105" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <!-- Peak LED R -->
    <rect x="92" y="32" width="28" height="5" rx="1" fill="#E11D48">
      <animate attributeName="opacity" values="0.2;0.9;0.2;1;0.2" dur="0.85s" repeatCount="indefinite"/>
    </rect>

    <text x="49" y="220" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">L</text>
    <text x="106" y="220" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">R</text>
  </g>
</svg>
